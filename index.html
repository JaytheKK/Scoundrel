<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoundrel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Scoundrel</h1>

  <div id="controls">
    <button id="new-game-btn">New Game</button>
    <span id="deck-count">Deck: 0 cards left</span>
  </div>

  <div id="hp-bar-wrapper">
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <span id="hp-text">20 / 20 HP</span>
  </div>

  <div id="room"></div>

  <button id="flee-btn">Flee Room</button>

  <p id="message"></p>

  <div id="weapon-area">
    <div id="weapon-slot-card" class="card weapon-slot-empty">
      <div class="sword-icon">⚔</div>
    </div>
    <p id="weapon-status">No weapon equipped</p>
    <label class="toggle-wrapper" for="weapon-toggle">
      <input type="checkbox" id="weapon-toggle" checked>
      <span>Using weapon</span>
    </label>
  </div>

  <script src="js/cards.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
